[project]
name = "terminal-os"
version = "0.1.0"
description = "Small TUI for common laptop settings (power, battery, Wi-Fi, Bluetooth)"
readme = "README.md"
authors = [
    { name = "Gustaf Broström", email = "gustafbrostrom@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
terminal-os = "terminal_os:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"
